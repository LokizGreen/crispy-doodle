<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Gem</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 1.5rem;
    background: radial-gradient(circle at 50% 30%, #2b1d4f, #0d0a1f 70%);
    color: #f5f0ff;
    font-family: system-ui, sans-serif;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    letter-spacing: .15em;
    text-transform: uppercase;
    text-shadow: 0 0 20px #b68cff;
  }

  .status { min-height: 2.5rem; font-size: 1.2rem; }
  .status.win  { color: #ffe066; text-shadow: 0 0 12px #ffe066; }
  .status.lose { color: #bbb; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    gap: 20px;
    perspective: 900px;
    transform: rotateX(25deg);
  }

  .card {
    width: 110px;
    height: 140px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .2s;
  }
  .card:not(.flipped):hover { transform: translateZ(14px); }

  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.3, 1.4, .5, 1);
  }
  .card.flipped .inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,.15);
    box-shadow: 0 12px 30px rgba(0,0,0,.5);
    backface-visibility: hidden;
    font-size: 2rem;
    font-weight: bold;
  }
  .front {
    background: linear-gradient(145deg, #5b3fa0, #2e1c5e);
    color: #d9c7ff;
  }
  .back {
    background: linear-gradient(145deg, #1f3b4d, #0e1d27);
    color: #8a8a9a;
    font-size: .9rem;
    transform: rotateY(180deg);
  }
  .card.gem .back {
    background: linear-gradient(145deg, #ffe066, #ff9f1c);
    color: #3a1f00;
    font-size: 3rem;
    box-shadow: 0 0 40px #ffe066;
  }

  button {
    padding: .7rem 1.8rem;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(145deg, #5b3fa0, #2e1c5e);
    color: #f5f0ff;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.4);
  }
  button:hover { transform: translateY(-2px); }

  .footer { font-size: .85rem; opacity: .6; }
</style>
</head>
<body>

<h1>Find the Gem</h1>
<p class="status" id="status">Pick a card.</p>
<main class="board" id="board"></main>
<button id="reset">New game</button>
<p class="footer">Attempts: <span id="attempts">0</span></p>

<script>
  const board = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const attemptsEl = document.getElementById("attempts");
  const resetBtn = document.getElementById("reset");

  const SIZE = 9;
  let gemIndex, attempts, over, cards;

  function newGame() {
    gemIndex = Math.floor(Math.random() * SIZE);
    attempts = 0;
    over = false;
    attemptsEl.textContent = "0";
    statusEl.textContent = "Pick a card.";
    statusEl.className = "status";

    board.innerHTML = "";
    cards = [];

    for (let i = 0; i < SIZE; i++) {
      const card = document.createElement("div");
      card.className = "card" + (i === gemIndex ? " gem" : "");
      card.innerHTML = `
        <div class="inner">
          <div class="face front">?</div>
          <div class="face back">${i === gemIndex ? "💎" : "Empty"}</div>
        </div>`;
      card.addEventListener("click", () => pick(i));
      board.appendChild(card);
      cards.push(card);
    }
  }

  function pick(i) {
    if (over || cards[i].classList.contains("flipped")) return;

    cards[i].classList.add("flipped");
    attempts++;
    attemptsEl.textContent = attempts;

    if (i === gemIndex) {
      over = true;
      statusEl.textContent = `💎 You found the gem in ${attempts} ${attempts === 1 ? "try" : "tries"}!`;
      statusEl.className = "status win";
    } else {
      statusEl.textContent = "Nope, keep looking…";
      statusEl.className = "status lose";
    }
  }

  resetBtn.addEventListener("click", newGame);
  newGame();
</script>
</body>
</html>
