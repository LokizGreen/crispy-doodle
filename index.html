<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grassy Field (CSS 3D)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #4d4d4d, #2c2c2c 85%);
  }

  .stage {
    position: fixed;
    inset: 0;
    perspective: 1000px;
  }

  .world {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    scale: var(--s, 1);
    animation: pan 24s ease-in-out infinite alternate;
  }
  @keyframes pan {
    from { transform: rotateY(-20deg); }
    to   { transform: rotateY(20deg); }
  }

  .field {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    transform: rotateX(-58deg);
  }

  /* Flat dark ground lying in the XZ plane */
  .ground {
    position: absolute;
    left: -500px;
    top: -400px;
    width: 1000px;
    height: 800px;
    background: linear-gradient(#0c1808, #15300d);
    transform: rotateX(90deg);
  }

  /* One grass blade: a tapered shape that stands on the ground and sways */
  .blade {
    position: absolute;
    transform-origin: 50% 100%;
    clip-path: polygon(50% 0%, 80% 40%, 100% 100%, 0% 100%, 20% 40%);
    animation: sway 3.2s ease-in-out infinite alternate;
  }
  @keyframes sway {
    from {
      transform: translate3d(var(--x), 0, var(--z))
                 rotateY(var(--ry))
                 rotateX(calc(var(--lean) - 6deg));
    }
    to {
      transform: translate3d(var(--x), 0, var(--z))
                 rotateY(var(--ry))
                 rotateX(calc(var(--lean) + 8deg));
    }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="world">
    <div class="field" id="field">
      <div class="ground"></div>
    </div>
  </div>
</div>

<script>
  const field = document.getElementById("field");
  const world = document.querySelector(".world");

  const W = 1000;      // field width (px)
  const D = 800;       // field depth (px)
  const COUNT = 1800;  // number of blades (more = thicker, but heavier)

  const rand = (a, b) => a + Math.random() * (b - a);
  const frag = document.createDocumentFragment();

  for (let i = 0; i < COUNT; i++) {
    const x = rand(-W / 2, W / 2);
    const z = rand(-D / 2, D / 2);
    const h = rand(70, 160);            // blade height
    const w = rand(5, 9);               // blade width at the base
    const lean = rand(-30, 30);         // resting tilt
    const ry = rand(0, 180);            // turn around the vertical axis
    const hue = rand(98, 122);
    const depth = (z + D / 2) / D;      // 0 = far edge, 1 = near edge
    const k = (0.7 + 0.3 * depth) * rand(0.92, 1.08);  // far blades darker
    const delay = -(x / 260 + rand(0, 0.4));           // wave rolls across the field

    // Dark roots at the base, bright tips at the top
    const bg = `linear-gradient(to top, hsl(${hue}, 60%, ${(9 * k).toFixed(1)}%) 0%, hsl(${hue}, 65%, ${(26 * k).toFixed(1)}%) 45%, hsl(${hue}, 75%, ${(44 * k).toFixed(1)}%) 85%, hsl(${hue + 4}, 80%, ${(56 * k).toFixed(1)}%) 100%)`;

    const b = document.createElement("div");
    b.className = "blade";
    b.style.cssText =
      `left:${(-w / 2).toFixed(1)}px;top:${(-h + 4).toFixed(1)}px;` +
      `width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;` +
      `--x:${x.toFixed(1)}px;--z:${z.toFixed(1)}px;` +
      `--ry:${ry.toFixed(1)}deg;--lean:${lean.toFixed(1)}deg;` +
      `background:${bg};animation-delay:${delay.toFixed(2)}s`;
    frag.appendChild(b);
  }
  field.appendChild(frag);

  // Scale the field to fit the window
  function fit() {
    const s = Math.min(innerWidth / 1100, innerHeight / 820);
    world.style.setProperty("--s", Math.min(s, 1.5).toFixed(3));
  }
  fit();
  addEventListener("resize", fit);
</script>
</body>
</html>
