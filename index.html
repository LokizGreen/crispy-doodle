<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holstein Cow (CSS 3D)</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 40%, #cfe0f0, #7d98b8 80%);
    overflow: hidden;
  }

  .stage { perspective: 1100px; }
  @media (max-width: 600px) { .stage { transform: scale(.6); } }

  .cow {
    position: relative;
    width: 0; height: 0;
    transform-style: preserve-3d;
    animation: spin 16s linear infinite;
  }
  @keyframes spin {
    from { transform: rotateX(-12deg) rotateY(0deg); }
    to   { transform: rotateX(-12deg) rotateY(360deg); }
  }

  /* Each tile is one flat, shaded facet of a body part */
  .t {
    position: absolute;
    left: 0; top: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="cow" id="cow"></div>
</div>

<script>
  const cow = document.getElementById("cow");

  // Light comes from above and the front-left (CSS y points down)
  const norm = v => { const l = Math.hypot(...v); return v.map(c => c / l); };
  const L = norm([-0.5, -0.75, 0.45]);

  // Colors
  const WHITE = [246, 244, 239];
  const BLACK = [22, 22, 24];
  const PINK  = [240, 166, 172];
  const HOOF  = [44, 40, 38];
  const CREAM = [232, 220, 190];
  const NOSE_DARK = [95, 52, 58];

  const solid = c => () => c;

  // Holstein-style patches: a smooth pattern in cow space decides black or white
  function spotted([x, y, z]) {
    const a = Math.sin(x * 0.022 + z * 0.015 + 0.8) * Math.cos(y * 0.03 - z * 0.02 + 0.4);
    const b = 0.7 * Math.sin(x * 0.05 - y * 0.025 + 2.1) * Math.cos(z * 0.045 + x * 0.012);
    return (a + b > 0.28) ? BLACK : WHITE;
  }

  // Each part is an ellipsoid: center p, radii r, grid detail nu x nv, color function
  const parts = [
    // Body and head
    { p: [0, 0, 0],          r: [115, 62, 58], nu: 16, nv: 24, col: spotted },
    { p: [-150, -30, 0],     r: [50, 46, 44],  nu: 12, nv: 14, col: spotted },

    // Snout and nostrils
    { p: [-198, 4, 0],       r: [30, 28, 32],  nu: 8,  nv: 10, col: solid(PINK) },
    { p: [-222, 6, -12],     r: [5, 5, 5],     nu: 4,  nv: 6,  col: solid(NOSE_DARK) },
    { p: [-222, 6, 12],      r: [5, 5, 5],     nu: 4,  nv: 6,  col: solid(NOSE_DARK) },

    // Eyes
    { p: [-182, -40, -30],   r: [7, 7, 7],     nu: 6,  nv: 8,  col: solid(BLACK) },
    { p: [-182, -40, 30],    r: [7, 7, 7],     nu: 6,  nv: 8,  col: solid(BLACK) },

    // Horns
    { p: [-142, -82, -26],   r: [6, 22, 6],    nu: 6,  nv: 8,  col: solid(CREAM) },
    { p: [-142, -82, 26],    r: [6, 22, 6],    nu: 6,  nv: 8,  col: solid(CREAM) },

    // Ears
    { p: [-128, -34, -58],   r: [30, 12, 9],   nu: 6,  nv: 8,  col: solid(BLACK) },
    { p: [-128, -34, 58],    r: [30, 12, 9],   nu: 6,  nv: 8,  col: solid(BLACK) },

    // Legs
    { p: [-62, 110, -36],    r: [14, 62, 14],  nu: 10, nv: 10, col: solid(WHITE) },
    { p: [-62, 110, 36],     r: [14, 62, 14],  nu: 10, nv: 10, col: solid(WHITE) },
    { p: [62, 110, -36],     r: [14, 62, 14],  nu: 10, nv: 10, col: solid(WHITE) },
    { p: [62, 110, 36],      r: [14, 62, 14],  nu: 10, nv: 10, col: solid(WHITE) },

    // Hooves
    { p: [-62, 168, -36],    r: [15, 10, 15],  nu: 6,  nv: 8,  col: solid(HOOF) },
    { p: [-62, 168, 36],     r: [15, 10, 15],  nu: 6,  nv: 8,  col: solid(HOOF) },
    { p: [62, 168, -36],     r: [15, 10, 15],  nu: 6,  nv: 8,  col: solid(HOOF) },
    { p: [62, 168, 36],      r: [15, 10, 15],  nu: 6,  nv: 8,  col: solid(HOOF) },

    // Udder
    { p: [10, 70, 0],        r: [26, 18, 22],  nu: 8,  nv: 10, col: solid(PINK) },

    // Tail and tuft
    { p: [120, 25, 0],       r: [5, 58, 5],    nu: 6,  nv: 8,  col: solid(WHITE) },
    { p: [122, 82, 0],       r: [11, 13, 11],  nu: 6,  nv: 8,  col: solid(BLACK) },
  ];

  // Builds one ellipsoid out of flat tiles, each oriented along the surface normal
  function ellipsoid({ p: [cx, cy, cz], r: [rx, ry, rz], nu, nv, col }) {
    const rr = (rx + rz) / 2;

    for (let i = 0; i < nu; i++) {
      const u = -Math.PI / 2 + Math.PI * (i + 0.5) / nu;
      const cu = Math.cos(u), su = Math.sin(u);
      const H = Math.max(3, Math.PI * ry / nu) + 2;

      for (let j = 0; j < nv; j++) {
        const v = 2 * Math.PI * (j + 0.5) / nv;
        const x = rx * cu * Math.cos(v);
        const y = ry * su;
        const z = rz * cu * Math.sin(v);

        const n = norm([x / (rx * rx), y / (ry * ry), z / (rz * rz)]);
        const W = Math.max(3, 2 * Math.PI * rr * cu / nv) + 2;

        // Rotate the tile so its front faces along the surface normal
        const th = Math.atan2(n[0], n[2]) * 180 / Math.PI;
        const ph = -Math.asin(n[1]) * 180 / Math.PI;

        // Simple flat shading for the faceted look
        const shade = 0.4 + 0.6 * Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2]);
        const [R, G, B] = col([cx + x, cy + y, cz + z]).map(c => Math.round(c * shade));

        const d = document.createElement("div");
        d.className = "t";
        d.style.cssText =
          `width:${W}px;height:${H}px;` +
          `margin:${-H / 2}px 0 0 ${-W / 2}px;` +
          `transform:translate3d(${cx + x}px,${cy + y}px,${cz + z}px) rotateY(${th}deg) rotateX(${ph}deg);` +
          `background:rgb(${R},${G},${B})`;
        cow.appendChild(d);
      }
    }
  }

  parts.forEach(ellipsoid);
</script>
</body>
</html>
