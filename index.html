
<!DOCTYPE html>
<html>
<head>
    <title>My Calculator</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background: #222;
            padding: 25px;
            border-radius: 15px;
            width: 250px;
        }

        input {
            width: 95%;
            height: 45px;
            font-size: 24px;
            margin-bottom: 10px;
        }

        button {
            width: 55px;
            height: 50px;
            margin: 3px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="calculator">
    <h2>Calculator</h2>

    <input id="screen" readonly>

    <div id="buttons"></div>
</div>

<script>
const screen = document.getElementById("screen");

const numbers = [
    "7", "8", "9", "/",
    "4", "5", "6", "*",
    "1", "2", "3", "-",
    "0", "C", "=", "+"
];

numbers.forEach(number => {
    const button = document.createElement("button");

    button.textContent = number;

    button.onclick = function() {
        if (number === "C") {
            screen.value = "";
        } 
        else if (number === "=") {
            try {
                screen.value = Function(
                    '"use strict"; return (' + screen.value + ')'
                )();
            } catch {
                screen.value = "Error";
            }
        } 
        else {
            screen.value += number;
        }
    };

    document.getElementById("buttons").appendChild(button);
});
</script>

</body>
</html>
