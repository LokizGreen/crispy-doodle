<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smooth 3D Cow</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 40%, #2a3b5c, #0b0f1e 75%);
    overflow: hidden;
  }

  .stage { perspective: 1100px; }

  .cow {
    position: relative;
    width: 0; height: 0;
    transform-style: preserve-3d;
    transform: rotateX(-10deg) scale(.9);
    animation: spin 14s linear infinite;
  }
  @keyframes spin {
    from { transform: rotateX(-10deg) scale(.9) rotateY(0deg); }
    to   { transform: rotateX(-10deg) scale(.9) rotateY(360deg); }
  }

  /* Each part is a 3D container placed at its center. Its slices are added by JS. */
  .part {
    position: absolute;
    left: 0; top: 0;
    transform-style: preserve-3d;
  }

  /* A flat, round slice. JS sets its size and transform. */
  .slice {
    position: absolute;
    left: 50%; top: 50%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%,
      color-mix(in srgb, var(--c) 70%, white),
      var(--c) 55%,
      color-mix(in srgb, var(--c) 60%, black));
  }
</style>
</head>
<body>
<div class="stage">
  <div class="cow" id="cow"></div>
</div>

<script>
  // Each part: center [x, y, z], radii [rx, ry, rz], color
  const parts = [
    // Body
    { p: [0, 0, 0],        r: [115, 62, 58], c: "#f5f2ec" },

    // Spots (flat patches sitting on the surface)
    { p: [-40, -18, 50],   r: [30, 24, 2],   c: "#1c1c1c" },
    { p: [55, 5, -50],     r: [26, 28, 2],   c: "#1c1c1c" },
    { p: [-5, -45, 30],    r: [22, 12, 2],   c: "#1c1c1c" },

    // Head and snout
    { p: [-150, -28, 0],   r: [52, 46, 44],  c: "#f5f2ec" },
    { p: [-198, 8, 0],     r: [30, 26, 32],  c: "#f2b8b5" },
    { p: [-222, 6, -11],   r: [5, 4, 4],     c: "#7a4a4a" },
    { p: [-222, 6, 11],    r: [5, 4, 4],     c: "#7a4a4a" },

    // Eyes
    { p: [-185, -40, -30], r: [7, 7, 7],     c: "#111" },
    { p: [-185, -40, 30],  r: [7, 7, 7],     c: "#111" },

    // Horns
    { p: [-140, -78, -24], r: [6, 22, 6],    c: "#efe3c2" },
    { p: [-140, -78, 24],  r: [6, 22, 6],    c: "#efe3c2" },

    // Ears
    { p: [-128, -35, -58], r: [30, 13, 9],   c: "#f2b8b5" },
    { p: [-128, -35, 58],  r: [30, 13, 9],   c: "#f2b8b5" },

    // Legs and hooves
    { p: [-62, 118, -36],  r: [15, 58, 15],  c: "#f5f2ec" },
    { p: [-62, 118, 36],   r: [15, 58, 15],  c: "#f5f2ec" },
    { p: [62, 118, -36],   r: [15, 58, 15],  c: "#f5f2ec" },
    { p: [62, 118, 36],    r: [15, 58, 15],  c: "#f5f2ec" },
    { p: [-62, 170, -36],  r: [16, 9, 16],   c: "#2a2a2a" },
    { p: [-62, 170, 36],   r: [16, 9, 16],   c: "#2a2a2a" },
    { p: [62, 170, -36],   r: [16, 9, 16],   c: "#2a2a2a" },
    { p: [62, 170, 36],    r: [16, 9, 16],   c: "#2a2a2a" },

    // Udder
    { p: [12, 72, 0],      r: [26, 18, 22],  c: "#f2b8b5" },

    // Tail and tuft
    { p: [122, 22, 0],     r: [5, 55, 5],    c: "#f5f2ec" },
    { p: [122, 78, 0],     r: [12, 12, 12],  c: "#1c1c1c" },
  ];

  const cow = document.getElementById("cow");
  const STEPS = 13;                 // slices per axis (more = smoother)

  function makeEllipsoid({ p, r, c }) {
    const [cx, cy, cz] = p;
    const [rx, ry, rz] = r;

    const part = document.createElement("div");
    part.className = "part";
    part.style.transform = `translate3d(${cx}px, ${cy}px, ${cz}px)`;

    // Stack slices along three axes so the shape looks round from any side
    for (let k = 0; k < STEPS; k++) {
      const t = -0.9 + (1.8 * k) / (STEPS - 1);   // from -0.9 to 0.9
      const s = Math.sqrt(1 - t * t);             // radius shrinks toward the ends

      const sets = [
        // Along Z: disc lies in the XY plane
        { w: 2 * rx * s, h: 2 * ry * s, tf: `translateZ(${t * rz}px)` },
        // Along X: disc lies in the YZ plane
        { w: 2 * rz * s, h: 2 * ry * s, tf: `translateX(${t * rx}px) rotateY(90deg)` },
        // Along Y: disc lies in the XZ plane
        { w: 2 * rx * s, h: 2 * rz * s, tf: `translateY(${t * ry}px) rotateX(90deg)` },
      ];

      for (const set of sets) {
        const d = document.createElement("div");
        d.className = "slice";
        d.style.setProperty("--c", c);
        d.style.width = `${set.w}px`;
        d.style.height = `${set.h}px`;
        d.style.marginLeft = `${-set.w / 2}px`;
        d.style.marginTop = `${-set.h / 2}px`;
        d.style.transform = set.tf;
        part.appendChild(d);
      }
    }
    return part;
  }

  parts.forEach(pt => cow.appendChild(makeEllipsoid(pt)));
</script>
</body>
</html>
