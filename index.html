<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Cow</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 40%, #2a3b5c, #0b0f1e 75%);
    overflow: hidden;
  }

  .stage { perspective: 1000px; }

  .cow {
    position: relative;
    width: 0; height: 0;
    transform-style: preserve-3d;
    transform: rotateX(-12deg);
    animation: spin 12s linear infinite;
  }
  @keyframes spin {
    from { transform: rotateX(-12deg) rotateY(0deg); }
    to   { transform: rotateX(-12deg) rotateY(360deg); }
  }

  /* A box, centered on the cow's origin. Each part sets --w, --h, --d, --x, --y, --z, --c. */
  .cube {
    position: absolute;
    left: 0; top: 0;
    width: var(--w);
    height: var(--h);
    margin-left: calc(var(--w) / -2);
    margin-top: calc(var(--h) / -2);
    transform-style: preserve-3d;
    transform: translate3d(var(--x), var(--y), var(--z));
  }
  .cube i {
    position: absolute;
    background: var(--c);
  }
  /* front and back */
  .cube i:nth-child(1) { inset: 0; transform: translateZ(calc(var(--d) / 2)); }
  .cube i:nth-child(2) { inset: 0; transform: rotateY(180deg) translateZ(calc(var(--d) / 2)); }
  /* right and left */
  .cube i:nth-child(3),
  .cube i:nth-child(4) {
    top: 0;
    left: calc(50% - var(--d) / 2);
    width: var(--d);
    height: var(--h);
  }
  .cube i:nth-child(3) { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); }
  .cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); }
  /* top and bottom */
  .cube i:nth-child(5),
  .cube i:nth-child(6) {
    left: 0;
    top: calc(50% - var(--d) / 2);
    width: var(--w);
    height: var(--d);
  }
  .cube i:nth-child(5) { transform: rotateX(90deg) translateZ(calc(var(--h) / 2)); }
  .cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(calc(var(--h) / 2)); }

  .spot { --c: #161616; }
</style>
</head>
<body>
<div class="stage">
  <div class="cow">

    <!-- Body -->
    <div class="cube" style="--w:200px;--h:120px;--d:110px;--x:0px;--y:0px;--z:0px;--c:#f4f1ea">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Spots -->
    <div class="cube spot" style="--w:60px;--h:50px;--d:2px;--x:-30px;--y:-10px;--z:56px">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube spot" style="--w:2px;--h:50px;--d:40px;--x:101px;--y:-5px;--z:0px">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube spot" style="--w:40px;--h:2px;--d:40px;--x:40px;--y:-61px;--z:10px">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube spot" style="--w:40px;--h:40px;--d:2px;--x:30px;--y:0px;--z:-56px">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Head -->
    <div class="cube" style="--w:90px;--h:80px;--d:80px;--x:-135px;--y:-25px;--z:0px;--c:#f4f1ea">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Snout -->
    <div class="cube" style="--w:50px;--h:44px;--d:70px;--x:-200px;--y:0px;--z:0px;--c:#f2b8b5">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Eyes -->
    <div class="cube" style="--w:8px;--h:12px;--d:4px;--x:-183px;--y:-40px;--z:-24px;--c:#111">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube" style="--w:8px;--h:12px;--d:4px;--x:-183px;--y:-40px;--z:24px;--c:#111">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Horns -->
    <div class="cube" style="--w:12px;--h:30px;--d:12px;--x:-130px;--y:-80px;--z:-26px;--c:#efe3c2">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube" style="--w:12px;--h:30px;--d:12px;--x:-130px;--y:-80px;--z:26px;--c:#efe3c2">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Ears -->
    <div class="cube" style="--w:44px;--h:22px;--d:10px;--x:-125px;--y:-45px;--z:-52px;--c:#f2b8b5">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube" style="--w:44px;--h:22px;--d:10px;--x:-125px;--y:-45px;--z:52px;--c:#f2b8b5">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Legs -->
    <div class="cube" style="--w:28px;--h:90px;--d:28px;--x:-70px;--y:105px;--z:-38px;--c:#e9e5dc">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube" style="--w:28px;--h:90px;--d:28px;--x:-70px;--y:105px;--z:38px;--c:#e9e5dc">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube" style="--w:28px;--h:90px;--d:28px;--x:70px;--y:105px;--z:-38px;--c:#e9e5dc">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube" style="--w:28px;--h:90px;--d:28px;--x:70px;--y:105px;--z:38px;--c:#e9e5dc">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Udder -->
    <div class="cube" style="--w:36px;--h:22px;--d:30px;--x:0px;--y:74px;--z:0px;--c:#f2b8b5">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- Tail and tuft -->
    <div class="cube" style="--w:8px;--h:70px;--d:8px;--x:110px;--y:25px;--z:0px;--c:#f4f1ea">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="cube" style="--w:16px;--h:16px;--d:16px;--x:110px;--y:64px;--z:0px;--c:#161616">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

  </div>
</div>
</body>
</html>
